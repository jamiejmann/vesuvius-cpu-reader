[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vc-reader-lite"
version = "0.0.1"
description = "Pure-Python stand-in for the subset of vc_reader that villa's flat ink inference uses (no compiler; any OS)."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "zarr>=3", "fsspec>=2024.3", "aiohttp", "tifffile", "imagecodecs"]

[tool.setuptools.packages.find]
where = ["src"]
