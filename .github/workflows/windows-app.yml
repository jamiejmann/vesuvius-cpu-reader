# Builds the portable Windows app (no Python install needed) on a GitHub-hosted Windows machine,
# tests it end to end with the bundled Python, and uploads VesuviusReader-win64-<ver>.zip as a run artifact.
# Lives at .github/workflows/windows-app.yml in jamiejmann/vesuvius-cpu-reader, with the
# app sources in winapp/ next to read_segment_cpu.py and vcr_lite/.
name: Windows app

on:
  workflow_dispatch:            # "Run workflow" button on the Actions tab
  push:
    branches: [winapp]          # test branch only

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # must match the embeddable Python's minor version (build_bundle.py PY_VERSION)

      - name: Unit tests (no network, no torch)
        run: python -m unittest winapp/tests/test_units.py

      - name: Build the bundle and run the self-test with the bundled Python
        run: |
          python -m pip install --upgrade pip
          python winapp/build/build_bundle.py --selftest

      - name: Check the MSVC runtime is bundled (for PCs without the VC++ redistributable)
        shell: pwsh
        run: |
          foreach ($d in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            if (-not (Test-Path "winapp/dist/VesuviusReader/python/$d")) { throw "missing $d" }
          }

      - name: End-to-end test of the app server (as the browser uses it)
        run: >
          winapp/dist/VesuviusReader/python/python.exe winapp/tests/smoke_server.py
          --python winapp/dist/VesuviusReader/python/python.exe
          --app winapp/dist/VesuviusReader/app

      - name: Test the unzipped copy from a path with spaces
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\My Apps"
          Expand-Archive winapp/dist/VesuviusReader-win64-*.zip -DestinationPath $dest
          & "$dest\VesuviusReader\python\python.exe" -X utf8 "$dest\VesuviusReader\app\reader_core.py" info
          if ($LASTEXITCODE -ne 0) { throw "bundle does not start from a path with spaces" }

      - uses: actions/upload-artifact@v4
        with:
          name: VesuviusReader-win64
          path: winapp/dist/VesuviusReader-win64-*.zip
          retention-days: 30
          compression-level: 0   # already zipped
